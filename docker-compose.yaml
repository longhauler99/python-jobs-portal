# version: "3.9"

services:
  web: 
    build: .
    container_name: jobs-portal-web
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"
    volumes:
#      - .:/app
      - /home/timothy-saina/Documents/dev/python-jobs-portal/static_root:/app/static_root
      - /home/timothy-saina/Documents/dev/python-jobs-portal/media:/app/media
#      - static_vol:/app/static_root
#      - media_vol:/app/media

  db:
    image: postgres:16
    container_name: jobs-portal-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
volumes:
  pgdata:

